# Local production-like stack: Postgres 16 + migrations + app.
#   docker compose up --build        → http://localhost:3000
# Passwords come from .env (git-ignored; template in .env.example). Compose refuses to start without them.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lens_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lens
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d lens"]
      interval: 3s
      retries: 20

  migrate:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lens_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/lens
      LENS_APP_PASSWORD: ${LENS_APP_PASSWORD:?set LENS_APP_PASSWORD in .env}
    command: >
      sh -c "node scripts/migrate.mjs &&
             node -e \"const pg=require('pg');const c=new pg.Client(process.env.DATABASE_URL);c.connect().then(()=>c.query('alter role lens_app login password '+c.escapeLiteral(process.env.LENS_APP_PASSWORD))).then(()=>c.end())\""
    restart: "no"

  app:
    build: .
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ["3000:3000"]
    env_file: .env.local
    environment:
      STORE_DRIVER: pg
      DATABASE_URL: postgres://lens_app:${LENS_APP_PASSWORD:?set LENS_APP_PASSWORD in .env}@db:5432/lens

volumes:
  pgdata:
