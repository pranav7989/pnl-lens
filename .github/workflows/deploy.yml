# Build → push to ECR → migrate → deploy to ECS. Template: fill in the env block.
name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "000000000000"
  DEPLOY_ROLE_ARN: arn:aws:iam::000000000000:role/lens-github-deploy
  ECR_REPO: lens
  ECS_CLUSTER: lens
  ECS_SERVICE: lens-web
  MIGRATE_TASK_DEF: lens-migrate
  PRIVATE_SUBNETS: subnet-aaa,subnet-bbb
  TASK_SECURITY_GROUP: sg-web
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${GITHUB_SHA}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Run migrations
        run: |
          TASK=$(aws ecs run-task --cluster $ECS_CLUSTER --launch-type FARGATE \
            --task-definition $MIGRATE_TASK_DEF \
            --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNETS],securityGroups=[$TASK_SECURITY_GROUP]}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"migrate\",\"image\":\"$IMAGE\"}]}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK
          CODE=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK --query 'tasks[0].containers[0].exitCode' --output text)
          test "$CODE" = "0"
      - name: Deploy web service
        run: |
          TD=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition $TD --query taskDefinition > td.json
          jq --arg IMG "$IMAGE" '.containerDefinitions[0].image=$IMG | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' td.json > td-new.json
          NEW=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --task-definition $NEW
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
