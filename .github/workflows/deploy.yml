# @file  .github/workflows/deploy.yml
# @area  Ops
# @what  On a v* tag: build the four images, push them to GHCR, then SSH to the VM and run infra/scripts/deploy.sh <tag> (rolls back by itself on failure).
#
# Repository secrets: DEPLOY_HOST, DEPLOY_USER (deploy), DEPLOY_SSH_KEY (private key of a key in the deploy user's
# authorized_keys), DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <host>`). Environment "production" can
# require a manual approval (Settings → Environments). On the VM, .env has IMAGE_REGISTRY=ghcr.io/<owner>/pnl-lens
# and the deploy user is logged in to ghcr.io (docs/DEPLOYMENT_VM.md). Tag only commits that passed CI.
name: deploy
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        service: [web, api, worker, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pnl-lens/${{ matrix.service }}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy (rolls back automatically if the site does not become ready)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" "cd /srv/pnl-lens && infra/scripts/deploy.sh '${GITHUB_REF_NAME}'"
