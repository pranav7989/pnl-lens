<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowLens · Market IQ</title>
  <style>
    :root { --bg: #0f1115; --panel: #161a20; --line: #262b33; --ink: #e8e8e8; --mut: #8b929c; --acc: #f08c3c; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 12vh auto 0; padding: 0 20px; }
    h1 { margin: 0 0 4px; font-size: 30px; } h1 span { color: var(--acc); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-top: 22px; }
    .mut { color: var(--mut); } footer { margin-top: 40px; color: var(--mut); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Flow<span>Lens</span> <small class="mut">working name</small></h1>
    <p class="mut">Market IQ dashboard: Nifty · Bank Nifty · Market</p>
    <div class="card">
      <b>Setting up.</b> The live sheets arrive in later phases. Server status: <span id="health">checking…</span>
    </div>
    <footer>Data and analytics only. Not investment advice.</footer>
  </main>
  <script>
    fetch('/health').then((r) => r.json()).then((j) => { document.getElementById('health').textContent = j.status; })
      .catch(() => { document.getElementById('health').textContent = 'not reachable'; });
  </script>
</body>
</html>
